  /stats/api/v1.0/regions:
    get:
      operationId: getRegions
      summary: Get Regions
      description: Get list of Regions by Country code
      tags:
      - Helpers
      x-permission:
      - Advertiser
      parameters:
      - name: country
        in: query
        required: true
        description: Country Code
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Region id
                        name:
                          type: string
                          description: Region name
                      required:
                      - id
                      - name
                    description: List of Regions
                required:
                - data
              example:
                success: true
                data:
                - id: FL
                  name: Florida
                - id: CA
                  name: California
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errors:
                - code: 500
                  title: There was a problem serving the requested information. Try again, the problem may be temporary. Please contact support if the problem persists.
      x-codeSamples:
      - lang: json
        label: Get regions
        source: "curl -X POST \\\n     -H \"Authorization: Bearer e62a04f681ba57d0120f8f584b688e31f04cf41d\" \\\n     -H \"Content-Type: application/json\" \\\n     -H \"Cache-Control: no-cache\" \\\n     'https://api.revcontent.io/stats/api/v1.0/regions?country=US'"
components:
  schemas:
    Error:
      type: object
      description: RevContent error envelope.
      properties:
        success:
          type: boolean
          const: false
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: integer
                description: HTTP-aligned error code.
              title:
                type: string
                description: Short error title.
              detail:
                type: string
                description: Human readable error detail.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 client-credentials access token obtained from POST /oauth/token. Valid for 24 hours.
