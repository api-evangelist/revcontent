  /stats/api/v1.0/os:
    get:
      operationId: getOperatingSystems
      summary: Get Operating Systems List
      description: Get list of Operating Systems For All Devices
      tags:
      - Helpers
      x-permission:
      - Advertiser
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: array
                          items:
                            type: string
                          description: Device Type
                      required:
                      - type
                    description: List of Operating Systems
                required:
                - data
              example:
                success: true
                data:
                - id: '4'
                  name: android
                  allowed_devices:
                  - mobile
                  - tablet
                - id: '5'
                  name: ios
                  allowed_devices:
                  - mobile
                  - tablet
                - id: '6'
                  name: windows
                  allowed_devices:
                  - mobile
                  - tablet
                - id: '7'
                  name: macos
                  allowed_devices:
                  - desktop
                - id: '8'
                  name: windows
                  allowed_devices:
                  - desktop
        '401':
