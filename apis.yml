aid: revcontent
name: RevContent
description: RevContent is a performance-driven native advertising and content recommendation
  network offering a REST API for managing widgets, campaigns (boosts), ad content,
  audience targeting, bidding, conversion pixels, sub accounts, and performance reporting.
  Publishers and advertisers access the platform through OAuth 2.0 client-credentials
  authenticated endpoints to programmatically control campaign settings, device, OS,
  browser, language and geo targeting, widget blacklisting, content delivery, and statistical
  reporting at scale. RevContent publishes its machine-readable contract as apiDoc rather
  than OpenAPI, at https://api.revcontent.io/docs/stats/api_data.json, covering 43 operations
  across eleven groups.
