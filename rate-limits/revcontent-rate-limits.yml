name: RevContent API Rate Limits
description: >-
  RevContent publishes NO rate limits. The provider's full machine-readable contract (287KB,
  regenerated 2026-07-31) documents no request quota, no throttling window and no rate-limit
  response header on any of its 43 operations, and neither does the help centre. An agent
  integrating this API has no runtime signal to pace against — the only feedback available is a 500.
