related_ceilings:
  description: >-
    These are NOT rate limits. They are the quantitative constraints the API does enforce, recorded
    here because they are what integrators most often mistake for rate limiting.
  items:
    - name: Access token lifetime
      value: 86400 seconds
      scope: per credential pair
      detail: >-
        Tokens from POST /oauth/token are valid 24 hours. No refresh token — re-POST client_id and
        client_secret. A 401 mid-run almost always means the token aged out.
    - name: Page size ceiling
      value: 1000
      scope: per list operation
      detail: >-
        `limit` defaults to 100 and caps at 1000 on most list operations — except
        GET /stats/api/v1.0/widgets_geo, which caps at 100. Paired with `offset`. No total count and
        no cursor is returned.
    - name: Minimum CPC bid
      value: 0.01 USD
      scope: campaign and widget-target bids
      detail: Enforced at the API since 2021-09-13. Lower values are rejected outright.
    - name: Bulk-update safety opt-in
      value: explicit parameter required
      scope: bulk campaign updates
      detail: >-
        Introduced 2021-03-08 to stop an unscoped update from applying to every campaign on the
        account.
    - name: CCPA processing time
      value: hours to fetch, up to 90 days to delete
      scope: CCPA data requests
      detail: Asynchronous. Not a rate limit, but it is the throughput constraint on that surface.

access_gating:
  self_serve: false
  detail: >-
    API access must be enabled by a RevContent account representative before Stats API credentials
    appear in Account Settings. Whatever account-level throttling exists is negotiated with that
    representative and is not published.

notes:
  - Absence recorded as data. limit_count is 0 because RevContent publishes zero numeric limits, not
    because the search was incomplete.
  - Without RateLimit-* or Retry-After headers there is no way for a client to back off correctly.
    Treat 500 as the only pressure signal and pace bulk reads conservatively.
