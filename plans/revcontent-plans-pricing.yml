generated: '2026-08-13'
method: searched
source: https://www.revcontent.com/advertisers/
name: RevContent Plans and Pricing
description: >-
  RevContent publishes NO plans, NO tiers and NO rate card. There is no pricing page on
  revcontent.com (/pricing and /advertisers/pricing both 404 as of 2026-08-13). Advertisers pay
  per-campaign on a CPC or vCPM auction basis; publishers are paid a negotiated revenue share.
  Neither number is public. Recorded as plan_count: 0 rather than inventing tiers out of the two
  commercial motions the site describes.
url: https://www.revcontent.com/advertisers/
created: '2026-06-13'
modified: '2026-08-13'

plan_count: 0
plans: []

pricing_model:
  advertisers:
    model: auction — CPC (cost per click) or vCPM (viewable cost per thousand impressions)
    published_rate_card: false
    minimum_spend: >-
      None. https://www.revcontent.com/advertisers/ states "Quick startup with no minimum spending
      requirements."
    minimum_bid:
      value: 0.01
      currency: USD
      scope: CPC bids on campaigns and on widget targets
      source: >-
        Enforced by the API since 2021-09-13
        (https://help.revcontent.com/knowledge/api-changelog). This is the only hard dollar figure
        RevContent publishes anywhere.
    budget_controls:
      - Per-campaign budget, set as an amount or `unlimited`
      - Pacing (on by default for limited budgets; forced off for unlimited)
      - Hour-level scheduling, available only on unlimited-budget campaigns
      - CSR accounts cannot hold unlimited budgets
    signup: https://www.revcontent.com/registration
  publishers:
    model: revenue share on widget clicks and impressions
    published_rate_card: false
    detail: >-
      The share percentage is negotiated per publisher and appears nowhere public. Acceptance is
      subject to content-quality and traffic review.
    url: https://www.revcontent.com/publishers

api_pricing:
  charged: false
  detail: >-
    API access carries no separate fee and no metered call charge. It is gated instead: a RevContent
    account representative must enable API access before Stats API credentials are issued in Account
    Settings. Access, not price, is the constraint.

evidence:
  - url: https://www.revcontent.com/advertisers/
    status: 200
    finding: 'No dollar figures, no tiers. "Quick startup with no minimum spending requirements."'
  - url: https://www.revcontent.com/pricing
    status: 404
  - url: https://www.revcontent.com/advertisers/pricing
    status: 404
  - url: https://www.revcontent.com/publishers
    status: 200
    finding: Revenue-share framing only, no percentage.

notes:
  - No free tier, no free trial, no self-serve published price.
  - The earlier version of this artifact modelled "Advertiser Self-Serve" and "Publisher
    Monetization" as plans. They are commercial motions, not published plans, and are recorded as
    pricing_model here so the plan count is honest.
