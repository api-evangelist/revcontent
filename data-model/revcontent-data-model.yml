description: Entity graph for the RevContent Stats & Management API, derived from path structure and the
  id-reference fields in request bodies and response schemas. RevContent's OpenAPI carries no reusable
  components.schemas $ref graph (the provider's contract is apiDoc, which documents flat field lists per
  operation), so relationships are derived from id fields and path nesting.
entities:
- name: account
  label: Account
  primary_key: —
  description: The authenticating advertiser or publisher account. Every operation is implicitly scoped
    to it.
- name: sub_account
  label: Sub Account
  primary_key: sub_account_id
  description: A child account under a parent account. Passed as sub_account_id on nearly every operation
    to act on behalf of a child.
- name: campaign
  label: Campaign (Boost)
  primary_key: boost_id
  description: An advertiser campaign. Carries bidding, budget, pacing, scheduling and all targeting.
    The provider's contract calls these Campaigns; the URL space still says /boosts.
- name: content
  label: Content
  primary_key: content_id
  description: A creative (headline + image + target URL) attached to a campaign.
- name: widget
  label: Widget
  primary_key: widget_id
  description: A publisher placement that renders RevContent recommendations.
- name: conversion
  label: Conversion
  primary_key: conversion_id
  description: A conversion pixel definition, referenced by a campaign when optimize=cpa.
- name: internal_content
  label: Widget Internal Content
  primary_key: —
  description: Publisher-owned content injected into that publisher's own widget.
- name: widget_target
  label: Widget Target
  primary_key: widget_id + boost_id
  description: A per-campaign, per-widget targeting row carrying an enabled flag and a bid override.
- name: widget_blacklist
  label: Widget Blacklist Entry
  primary_key: widget_id + boost_id
  description: A widget explicitly excluded from a campaign by the widget optimizer.
- name: access_token
  label: Access Token
  primary_key: —
  description: A 24-hour OAuth 2.0 client-credentials bearer token.
