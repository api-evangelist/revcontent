identifier_conventions:
- IDs are opaque numeric strings; there are no typed/prefixed identifiers.
- 'sub_account_id is the tenancy dimension: omit it to act on your own account, supply it to act on a
  child account. It appears on 30+ of the 43 operations.'
- There is no single canonical GET-by-id for a campaign; GET /stats/api/v1.0/boosts accepts an optional
  boost_id filter instead.
