description: >-
  RevContent maintains a dated API changelog in its help centre. It is real and it is
  operation-level specific, but it has not been updated since 13 September 2021 — nearly five
  years. Meanwhile the provider's own generated contract at
  https://api.revcontent.io/docs/stats/api_data.json was regenerated on 2026-07-31 and documents
  operations (Conversions, Sub Accounts, Widget Optimizer, browsers/languages/regions helpers) that
  the changelog never announced. The changelog and the shipped API have diverged.

