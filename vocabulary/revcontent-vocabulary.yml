vocabulary:
  - term: boost
    definition: A RevContent campaign unit. Boosts encapsulate budget, bidding, targeting,
      scheduling, and associated ad content. Equivalent to a "campaign" in most
      advertising platforms.
    related:
      - campaign
      - ad group

  - term: widget
    definition: A content recommendation placement unit deployed on publisher pages.
      Widgets display native ad content to end users and are the primary delivery
      mechanism for RevContent ads.
    related:
      - placement
      - widget_id

  - term: bid
    definition: The cost-per-click (CPC) amount an advertiser is willing to pay for
      a click on their boost content. Minimum bid is $0.01.
    related:
      - CPC
      - cost-per-click

  - term: CPC
    definition: Cost Per Click — the pricing model used by RevContent for boost campaigns.
      Advertisers pay a set bid amount each time a user clicks on their native ad content.

  - term: content
    definition: Individual ad creative items within a boost, comprising a headline
      and image. Content performance is tracked at the widget and aggregate boost level.
    related:
      - creative
      - headline

  - term: targeting
    definition: The configuration of which widgets, devices, operating systems, DMAs,
      zip codes, and traffic types a boost's ads will serve on.
    related:
      - widget targets
      - geo-targeting
      - device targeting

  - term: DMA
    definition: Designated Market Area — a geographic region used for audience targeting
      in the United States. RevContent provides a list of DMA codes and names via
      the helpers/dma endpoint.
    related:
      - geo-targeting
      - DMA code

  - term: publisher_id
    definition: Unique identifier for a RevContent publisher account. Publisher IDs
      are included in widget-level content statistics for advertiser reporting.
    related:
      - pub_id
      - widget

  - term: OAuth 2.0 client credentials
    definition: The authentication method used by the RevContent API. Advertisers and
      publishers supply a client_id and client_secret to obtain a Bearer access token
      valid for 24 hours.
    related:
      - access_token
      - Bearer token

  - term: CCPA
    definition: California Consumer Privacy Act — US privacy regulation requiring platforms
      to honor consumer data access and deletion requests. RevContent provides a dedicated
      API endpoint for submitting CCPA data requests and deletions.
    related:
      - data_request
      - delete_data

  - term: do_all
    definition: A safety parameter in the Update Boost Status endpoint. Must be explicitly
      set to true to apply a status change to all boosts simultaneously, preventing
      accidental bulk operations.

  - term: cost_per_conversion
    definition: A performance metric representing the average spend required to generate
      one conversion event. Available in boost performance and content performance
      reporting endpoints.

  - term: RevGPT
    definition: RevContent's generative AI headline creation tool that uses large language
      models to suggest native ad headlines for boost content.

  # Added 2026-08-13 from RevContent's published contract
  # (https://api.revcontent.io/docs/stats/api_data.json, regenerated 2026-07-31).
  - term: campaign
    definition: What RevContent's own current documentation calls a boost. The provider renamed
      the concept in its API reference (group "Campaigns", titles "Add Campaign", "Get All
      Campaigns") while leaving the URL space on /boosts. Both names refer to the same object.
    related:
      - boost

  - term: sub_account_id
    definition: The tenancy parameter. Omit it to act on the authenticating account; supply it to
      act on a child account. Present on 18 of 43 operations as a plain query or body parameter,
      not as a token boundary — one client-credentials token reaches every child account.
    related:
      - sub account
      - tenancy

  - term: pacing
    definition: Spreads a limited campaign budget evenly through the day rather than spending as
      fast as possible. Defaults to on for limited budgets; forced off when budget is "unlimited".

  - term: default_bids
    definition: The current per-surface bid structure on a campaign, with web, email and
      apple_news keys. Supersedes the flat bid_amount field, which RevContent's contract marks
      deprecated and retained only for backward compatibility.
    related:
      - bid
      - bid_amount

  - term: widget optimizer
    definition: The campaign-level widget blacklist. Distinct from widget targeting — a widget can
      be an enabled target and still be blacklisted. Managed under
      /boosts/{boost_id}/targets/blacklist/widgets.
    related:
      - blacklist
      - targeting

  - term: Sub ID
    definition: A publisher-set identifier placed in the widget ad code and reported back through
      GET /stats/api/v1.0/widgets/{widget_id}/revsub. The only join between what a publisher
      deployed on-page and what the API reports.
    related:
      - revsub

  - term: internal content
    definition: Publisher-owned articles injected into that publisher's own widget alongside
      RevContent demand.

  - term: vCPM
    definition: Viewable cost per thousand impressions. The alternative bid_type to cpc on a
      campaign.

  - term: conversion pixel
    definition: A tracking definition created through the Conversions API and bound to a campaign
      via conversion.id. Mandatory whenever a campaign sets optimize to "cpa".

  - term: aggregate
    definition: A query parameter on three list operations. When set to "yes" the response carries
      an additional statistics rollup keyed by date alongside the row-level data.

  - term: traffic_type
    definition: RETIRED. Announced 2020-10-14 as a campaign targeting parameter with a matching
      helper endpoint, and documented as such through 2021. Neither the parameter nor the
      /helpers/traffic-types endpoint appears in the contract RevContent generated on 2026-07-31.
      No removal notice was ever published.
    status: retired
